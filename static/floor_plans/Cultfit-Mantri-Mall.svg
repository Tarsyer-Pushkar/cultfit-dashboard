<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1662f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="950" height="520" fill="#ffffff"/>

  <text x="60" y="45" font-size="24" font-weight="700" fill="#1f2937">CULTFIT - MANTRI MALL - TOP VIEW FLOOR PLAN</text>

  <!-- store floor -->
  <rect x="60" y="100" width="800" height="300" fill="#f4f2ec" stroke="none"/>

  <!-- section divider (dashed, non-structural) -->
  <line x1="460" y1="100" x2="460" y2="400" stroke="#b9b4a8" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- ===== ZONES (data-zone tagged for live traffic overlay) ===== -->
  <!-- Section 1 : camera_2 -->
  <polygon id="zone-poly-Zone_1" class="zone-poly" data-zone="Zone_1" points="80,120 440,120 440,380 80,380" fill="#a7d8de" fill-opacity="0.55" stroke="#4a9ba5" stroke-width="1.5"/>
  <text id="zone-label-Zone_1" class="zone-label" data-zone="Zone_1" x="260" y="205" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_1</text>

  <!-- Section 2 : camera_4 -->
  <polygon id="zone-poly-Zone_2" class="zone-poly" data-zone="Zone_2" points="480,120 840,120 840,380 480,380" fill="#f4a3a3" fill-opacity="0.55" stroke="#c65b5b" stroke-width="1.5"/>
  <text id="zone-label-Zone_2" class="zone-label" data-zone="Zone_2" x="660" y="205" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_2</text>

  <!-- ===== WALLS (with entrance gap on south/bottom wall) ===== -->
  <g stroke="#24303d" stroke-width="10" stroke-linecap="square" stroke-linejoin="round" fill="none">
    <line x1="60" y1="100" x2="860" y2="100"/>
    <line x1="860" y1="100" x2="860" y2="400"/>
    <line x1="860" y1="400" x2="490" y2="400"/>
    <line x1="430" y1="400" x2="60" y2="400"/>
    <line x1="60" y1="400" x2="60" y2="100"/>
  </g>

  <!-- entrance marker (also the anchor for the "Entry" node in journeys/arrows) -->
  <g id="entrance-anchor" data-x="460" data-y="400">
    <line x1="460" y1="455" x2="460" y2="405" stroke="#3f8f4f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="420" y="478" font-size="13" font-style="italic" fill="#3f8f4f">Entrance</text>
  </g>

  <!-- ===== CAMERA POSITIONS ===== -->
  <g>
    <circle cx="430" cy="140" r="8" fill="#24303d"/>
    <text x="330" y="163" font-size="13" fill="#1f2937">Section_1 - camera_2</text>

    <circle cx="830" cy="140" r="8" fill="#24303d"/>
    <text x="700" y="163" font-size="13" fill="#1f2937">Section_2 - camera_4</text>
  </g>

  <!-- ===== CAMERA FLOW PATH (static reference — camera-to-camera adjacency, not live data) ===== -->
  <g stroke="#d1662f" stroke-width="5" stroke-dasharray="14,10" fill="none" opacity="0.9">
    <line x1="260" y1="340" x2="660" y2="340" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== dynamic traffic arrows are injected here at runtime by sfDrawArrows() ===== -->
  <g id="traffic-arrows-layer"></g>
</svg>
