<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 760" width="1550" height="760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1662f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1550" height="760" fill="#ffffff"/>

  <text x="60" y="45" font-size="26" font-weight="700" fill="#1f2937">CULTFIT - HSR STORE - TOP VIEW FLOOR PLAN</text>

  <!-- store floor -->
  <polygon points="60,100 1490,100 1490,700 1140,700 1140,400 60,400" fill="#f4f2ec" stroke="none"/>

  <!-- section dividers (dashed, non-structural) -->
  <line x1="410" y1="100" x2="410" y2="400" stroke="#b9b4a8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="760" y1="100" x2="760" y2="400" stroke="#b9b4a8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="1110" y1="100" x2="1110" y2="400" stroke="#b9b4a8" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="1140" y1="400" x2="1490" y2="400" stroke="#b9b4a8" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- ===== ZONES (data-zone tagged for live traffic overlay) ===== -->
  <!-- Section 1 : camera_5 -->
  <polygon id="zone-poly-Zone_1" class="zone-poly" data-zone="Zone_1" points="80,120 390,120 390,380 80,380" fill="#a7d8de" fill-opacity="0.55" stroke="#4a9ba5" stroke-width="1.5"/>
  <text id="zone-label-Zone_1" class="zone-label" data-zone="Zone_1" x="235" y="205" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_1</text>

  <!-- Section 2 : camera_7 -->
  <polygon id="zone-poly-Zone_3" class="zone-poly" data-zone="Zone_3" points="430,120 580,120 580,380 430,380" fill="#f4a3a3" fill-opacity="0.55" stroke="#c65b5b" stroke-width="1.5"/>
  <text id="zone-label-Zone_3" class="zone-label" data-zone="Zone_3" x="505" y="205" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_3</text>
  <polygon id="zone-poly-Zone_2" class="zone-poly" data-zone="Zone_2" points="590,120 750,120 750,380 590,380" fill="#f7c59f" fill-opacity="0.55" stroke="#c68952" stroke-width="1.5"/>
  <text id="zone-label-Zone_2" class="zone-label" data-zone="Zone_2" x="670" y="205" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_2</text>

  <!-- Section 3 : camera_2 -->
  <polygon id="zone-poly-Zone_6" class="zone-poly" data-zone="Zone_6" points="780,120 1090,120 1090,210 780,210" fill="#f9e39c" fill-opacity="0.55" stroke="#c6a83f" stroke-width="1.5"/>
  <text id="zone-label-Zone_6" class="zone-label" data-zone="Zone_6" x="935" y="170" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_6</text>
  <polygon id="zone-poly-Zone_5" class="zone-poly" data-zone="Zone_5" points="780,220 1090,220 1090,310 780,310" fill="#c9b8e0" fill-opacity="0.55" stroke="#8a72b0" stroke-width="1.5"/>
  <text id="zone-label-Zone_5" class="zone-label" data-zone="Zone_5" x="935" y="270" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_5</text>
  <polygon id="zone-poly-Zone_4" class="zone-poly" data-zone="Zone_4" points="950,320 1090,320 1090,380 950,380" fill="#b8e0a0" fill-opacity="0.55" stroke="#6ea34a" stroke-width="1.5"/>
  <text id="zone-label-Zone_4" class="zone-label" data-zone="Zone_4" x="1020" y="355" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_4</text>

  <!-- Section 4 : camera_4 -->
  <polygon id="zone-poly-Zone_7" class="zone-poly" data-zone="Zone_7" points="1130,120 1270,120 1270,380 1130,380" fill="#9fd8c2" fill-opacity="0.55" stroke="#4f9c7c" stroke-width="1.5"/>
  <text id="zone-label-Zone_7" class="zone-label" data-zone="Zone_7" x="1200" y="255" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_7</text>
  <polygon id="zone-poly-Zone_8" class="zone-poly" data-zone="Zone_8" points="1280,120 1470,120 1470,240 1280,240" fill="#f0a6c2" fill-opacity="0.55" stroke="#c25a86" stroke-width="1.5"/>
  <text id="zone-label-Zone_8" class="zone-label" data-zone="Zone_8" x="1375" y="185" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_8</text>
  <polygon id="zone-poly-Zone_9" class="zone-poly" data-zone="Zone_9" points="1280,250 1470,250 1470,380 1280,380" fill="#a6b8f0" fill-opacity="0.55" stroke="#5a72c2" stroke-width="1.5"/>
  <text id="zone-label-Zone_9" class="zone-label" data-zone="Zone_9" x="1375" y="320" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_9</text>

  <!-- Section 5 : camera_3 (turn) -->
  <polygon id="zone-poly-Zone_10" class="zone-poly" data-zone="Zone_10" points="1160,420 1470,420 1470,680 1160,680" fill="#d8b48a" fill-opacity="0.55" stroke="#a67a44" stroke-width="1.5"/>
  <text id="zone-label-Zone_10" class="zone-label" data-zone="Zone_10" x="1315" y="510" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Zone_10</text>

  <!-- ===== WALLS (with entrance gap on west wall) ===== -->
  <g stroke="#24303d" stroke-width="10" stroke-linecap="square" stroke-linejoin="round" fill="none">
    <line x1="60" y1="100" x2="1490" y2="100"/>
    <line x1="1490" y1="100" x2="1490" y2="700"/>
    <line x1="1490" y1="700" x2="1140" y2="700"/>
    <line x1="1140" y1="700" x2="1140" y2="400"/>
    <line x1="1140" y1="400" x2="60" y2="400"/>
    <line x1="60" y1="400" x2="60" y2="260"/>
    <line x1="60" y1="220" x2="60" y2="100"/>
  </g>

  <!-- entrance marker (also the anchor for the "Entry" node in journeys/arrows) -->
  <g id="entrance-anchor" data-x="60" data-y="240">
    <line x1="15" y1="240" x2="58" y2="240" stroke="#3f8f4f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="10" y="290" font-size="13" font-style="italic" fill="#3f8f4f">Entrance</text>
  </g>

  <!-- ===== CAMERA POSITIONS ===== -->
  <g>
    <circle cx="380" cy="140" r="8" fill="#24303d"/>
    <text x="300" y="163" font-size="13" fill="#1f2937">Section_1 - camera_5</text>

    <circle cx="740" cy="140" r="8" fill="#24303d"/>
    <text x="655" y="163" font-size="13" fill="#1f2937">Section_2 - camera_7</text>

    <circle cx="1080" cy="140" r="8" fill="#24303d"/>
    <text x="995" y="163" font-size="13" fill="#1f2937">Section_3 - camera_2</text>

    <circle cx="1460" cy="140" r="8" fill="#24303d"/>
    <text x="1330" y="163" font-size="13" fill="#1f2937">Section_4 - camera_4</text>

    <circle cx="1460" cy="440" r="8" fill="#24303d"/>
    <text x="1300" y="463" font-size="13" fill="#1f2937">Section_5 - camera_3 (turn)</text>
  </g>

  <!-- ===== CAMERA FLOW PATH (static reference — camera-to-camera adjacency, not live data) ===== -->
  <g stroke="#d1662f" stroke-width="5" stroke-dasharray="14,10" fill="none" opacity="0.9">
    <line x1="235" y1="365" x2="585" y2="365" marker-end="url(#arrow)"/>
    <line x1="585" y1="365" x2="935" y2="365" marker-end="url(#arrow)"/>
    <line x1="935" y1="365" x2="1300" y2="365" marker-end="url(#arrow)"/>
    <line x1="1300" y1="365" x2="1300" y2="600" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== dynamic traffic arrows are injected here at runtime by sfDrawArrows() ===== -->
  <g id="traffic-arrows-layer"></g>
</svg>
